<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Imagen social — Vigilia nocturna</title>
    <!-- Generar: google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size=1200,630 --screenshot=public/og.png tools/og.html -->
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: #0c1220;
        color: #eaedf3;
        font-family: 'Geist', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        justify-content: center;
        background:
          radial-gradient(640px 380px at 86% 6%, rgba(240, 169, 59, 0.16), transparent 72%),
          radial-gradient(500px 340px at 10% 88%, rgba(111, 176, 238, 0.08), transparent 70%),
          #0c1220;
        box-shadow: inset 6px 0 0 #f0a93b;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(234, 237, 243, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(234, 237, 243, 0.045) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: radial-gradient(ellipse 75% 75% at 68% 28%, #000, transparent 78%);
        mask-image: radial-gradient(ellipse 75% 75% at 68% 28%, #000, transparent 78%);
      }
      /* Columna central segura ante recortes 1:1 en miniaturas */
      .col {
        position: relative;
        z-index: 1;
        width: 630px;
        height: 630px;
        padding: 54px 44px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .mark {
        font-family: 'Geist Mono', monospace;
        font-weight: 600;
        font-size: 38px;
        color: #eaedf3;
      }
      .mark span {
        color: #f0a93b;
      }
      .pill {
        font-family: 'Geist Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9ba7bd;
        padding: 6px 12px;
        border: 1px solid #26324b;
        border-radius: 999px;
        background: rgba(19, 27, 44, 0.8);
      }
      .target {
        position: relative;
        display: inline-block;
        align-self: flex-start;
        margin: 18px 0 22px;
      }
      .bbox {
        position: absolute;
        inset: -14px -18px -16px -18px;
        border: 1px solid rgba(240, 169, 59, 0.26);
      }
      .bbox i {
        position: absolute;
        width: 18px;
        height: 18px;
        border: 2.5px solid #f0a93b;
      }
      .bbox i:nth-child(1) { top: -1px; left: -1px; border-width: 2.5px 0 0 2.5px; }
      .bbox i:nth-child(2) { top: -1px; right: -1px; border-width: 2.5px 2.5px 0 0; }
      .bbox i:nth-child(3) { bottom: -1px; right: -1px; border-width: 0 2.5px 2.5px 0; }
      .bbox i:nth-child(4) { bottom: -1px; left: -1px; border-width: 0 0 2.5px 2.5px; }
      .bbox b {
        position: absolute;
        left: -1px;
        bottom: 100%;
        padding: 3px 10px;
        background: #f0a93b;
        color: #0c1220;
        font-family: 'Geist Mono', monospace;
        font-size: 16px;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-family: 'Archivo Variable', 'Geist', sans-serif;
        font-size: 92px;
        font-weight: 800;
        font-stretch: 112%;
        letter-spacing: -0.035em;
        line-height: 0.92;
        color: #eaedf3;
      }
      .sub {
        margin: 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.35;
        color: #eaedf3;
      }
      .sub span {
        display: block;
        color: #9ba7bd;
        font-weight: 400;
        font-size: 22px;
        margin-top: 4px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 22px;
        border-top: 1px solid #26324b;
        font-family: 'Geist Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9ba7bd;
      }
      .foot b {
        color: #f0a93b;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <div class="col">
        <div class="top">
          <div class="mark">bc<span>_</span></div>
          <div class="pill">Python · MCP · IA</div>
        </div>
        <div>
          <div class="target">
            <h1>Benjamín<br />Criado</h1>
            <span class="bbox">
              <i></i><i></i><i></i><i></i>
              <b>persona 0,99</b>
            </span>
          </div>
          <p class="sub">
            Ingeniero informático
            <span>Software en Python, agentes de IA y automatización</span>
          </p>
        </div>
        <div class="foot"><b>benjamincriado.dev</b><span>La Serena, Chile</span></div>
      </div>
    </div>
  </body>
</html>
